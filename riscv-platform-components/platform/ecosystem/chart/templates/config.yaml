apiVersion: v1
kind: ConfigMap
metadata:
  name: rv-prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 10s
    scrape_configs:
    - job_name: rv-nodes
      static_configs:
      - targets:
{{ toYaml .Values.nodeTargets | indent 8 }}
    - job_name: prometheus
      static_configs:
      - targets: ["localhost:9090"]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rv-grafana-config
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      uid: rv-prometheus
      type: prometheus
      access: proxy
      url: http://rv-prometheus:9090
      isDefault: true
      editable: false
  provider.yaml: |
    apiVersion: 1
    providers:
    - name: rv-platform
      type: file
      options:
        path: /var/lib/grafana/dashboards
  dashboard.json: |
    {"title":"RISC-V Platform","uid":"rv-platform","schemaVersion":39,"version":1,"refresh":"10s","panels":[{"id":1,"type":"timeseries","title":"CPU utilization","datasource":{"uid":"rv-prometheus","type":"prometheus"},"targets":[{"expr":"rv_node_cpu_utilization_ratio","legendFormat":"{{ "{{instance}}" }}"}],"gridPos":{"x":0,"y":0,"w":12,"h":8}},{"id":2,"type":"timeseries","title":"Available memory bytes","datasource":{"uid":"rv-prometheus","type":"prometheus"},"targets":[{"expr":"rv_node_memory_available_bytes","legendFormat":"{{ "{{instance}}" }}"}],"gridPos":{"x":12,"y":0,"w":12,"h":8}}],"time":{"from":"now-1h","to":"now"}}

