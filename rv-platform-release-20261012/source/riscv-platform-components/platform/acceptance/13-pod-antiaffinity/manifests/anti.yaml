apiVersion: "v1"
kind: "Pod"
metadata:
  name: "anti"
  namespace: "@@NS@@"
  labels:
    app: "exclusive"
spec:
  nodeSelector:
    kubernetes.io/hostname: "@@NODE_HOSTNAME@@"
  restartPolicy: "Never"
  automountServiceAccountToken: false
  containers:
    -
      name: "workload"
      image: "@@TEST_IMAGE@@"
      imagePullPolicy: "Never"
      command:
        - "sleep"
        - "86400"
      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
        limits:
          cpu: "1"
          memory: "128Mi"
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        -
          labelSelector:
            matchLabels:
              app: "exclusive"
          topologyKey: "kubernetes.io/hostname"
