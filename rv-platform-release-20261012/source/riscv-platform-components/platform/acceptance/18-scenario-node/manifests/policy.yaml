apiVersion: "platform.riscv.io/v1alpha1"
kind: "ScenarioPolicy"
metadata:
  name: "@@PROFILE_POLICY@@"
  namespace: "@@PROFILE_NS@@"
  labels:
    platform.riscv.io/acceptance: "@@NONCE@@"
spec:
  query: "vector(0.9)"
  low: 0.3
  high: 0.8
  consecutiveSamples: 2
  cooldownSeconds: 0
  highAction:
    type: "configureNode"
    profile: "@@PROFILE_NAME@@"
    labels:
      platform.riscv.io/accept-@@NONCE@@: "hot"
