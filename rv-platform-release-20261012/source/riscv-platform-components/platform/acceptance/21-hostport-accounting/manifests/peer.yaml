apiVersion: "platform.riscv.io/v1alpha1"
kind: "HostNetworkWorkload"
metadata:
  name: "tcp-peer"
  namespace: "@@NS@@"
spec:
  node: "@@TEST_NODE@@"
  image: "@@TEST_IMAGE@@"
  command:
    - "iperf3"
    - "-s"
    - "-p"
    - "@@NET_SERVER_PORT@@"
  requests:
    cpu: "10m"
    memory: "16Mi"
  limits:
    cpu: "1"
    memory: "128Mi"
  ports:
    -
      name: "tcp"
      containerPort: "@@NET_SERVER_PORT@@"
      protocol: "TCP"
