apiVersion: "platform.riscv.io/v1alpha1"
kind: "HostNetworkWorkload"
metadata:
  name: "host-client"
  namespace: "@@NS@@"
spec:
  node: "@@TEST_NODE@@"
  image: "@@TEST_IMAGE@@"
  command:
    - "sleep"
    - "86400"
  requests:
    cpu: "10m"
    memory: "16Mi"
  limits:
    cpu: "1"
    memory: "128Mi"
  ports: []
