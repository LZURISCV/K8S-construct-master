apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "scene-app"
  namespace: "@@NS@@"
  annotations:
    platform.riscv.io/allow-scaling: "feedback"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "scene-app"
  template:
    metadata:
      labels:
        app: "scene-app"
    spec:
      nodeSelector:
        kubernetes.io/hostname: "@@NODE_HOSTNAME@@"
      automountServiceAccountToken: false
      containers:
        -
          name: "workload"
          image: "@@TEST_IMAGE@@"
          imagePullPolicy: "Never"
          command:
            - "sleep"
            - "86400"
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "1"
              memory: "128Mi"
