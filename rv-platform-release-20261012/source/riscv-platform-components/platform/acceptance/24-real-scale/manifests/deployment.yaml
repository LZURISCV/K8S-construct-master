apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "scale"
  namespace: "@@NS@@"
  annotations: {}
spec:
  replicas: "@@SCALE_PODS@@"
  selector:
    matchLabels:
      app: "scale"
  template:
    metadata:
      labels:
        app: "scale"
    spec:
      nodeSelector:
        kubernetes.io/hostname: "@@NODE_HOSTNAME@@"
      automountServiceAccountToken: false
      containers:
        -
          name: "workload"
          image: "@@TEST_IMAGE@@"
          imagePullPolicy: "Never"
          command:
            - "sleep"
            - "86400"
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "32Mi"
