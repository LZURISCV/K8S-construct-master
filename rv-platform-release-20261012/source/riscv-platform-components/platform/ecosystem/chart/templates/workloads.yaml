apiVersion: apps/v1
kind: Deployment
metadata:
  name: rv-prometheus
spec:
  replicas: 1
  selector:
    matchLabels: {app: rv-prometheus}
  template:
    metadata:
      labels: {app: rv-prometheus}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum | quote }}
    spec:
      automountServiceAccountToken: false
{{ with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
{{ end }}
      securityContext: {runAsUser: 65534, runAsGroup: 65534, fsGroup: 65534}
      containers:
      - name: prometheus
        image: {{ required "set prometheusImage to a validated linux/riscv64 image" .Values.prometheusImage | quote }}
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        command: ["/bin/prometheus"]
        args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time={{ .Values.retention }}"]
        ports: [{name: http, containerPort: 9090}]
        readinessProbe: {httpGet: {path: /-/ready, port: http}}
        resources:
          requests: {cpu: "250m", memory: 256Mi}
          limits: {cpu: "2", memory: 2Gi}
        volumeMounts:
        - {name: config, mountPath: /etc/prometheus}
        - {name: data, mountPath: /prometheus}
      volumes:
      - name: config
        configMap: {name: rv-prometheus-config}
      - name: data
{{ if .Values.storage.enabled }}
        persistentVolumeClaim: {claimName: rv-prometheus-data}
{{ else }}
        emptyDir: {}
{{ end }}
---
apiVersion: v1
kind: Service
metadata: {name: rv-prometheus}
spec:
  type: {{ .Values.service.type }}
  selector: {app: rv-prometheus}
  ports:
  - name: http
    port: 9090
    targetPort: http
{{ if eq .Values.service.type "NodePort" }}
    nodePort: {{ .Values.service.prometheusNodePort }}
{{ end }}
{{ if .Values.storage.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rv-prometheus-data
spec:
  accessModes: [ReadWriteOnce]
{{ if .Values.storage.storageClass }}
  storageClassName: {{ .Values.storage.storageClass | quote }}
{{ end }}
  resources:
    requests:
      storage: {{ .Values.storage.prometheusSize }}
{{ end }}
