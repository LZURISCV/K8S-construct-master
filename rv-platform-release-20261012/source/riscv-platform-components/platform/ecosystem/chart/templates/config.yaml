apiVersion: v1
kind: ConfigMap
metadata:
  name: rv-prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 10s
    scrape_configs:
    - job_name: rv-nodes
      static_configs:
      - targets:
{{ toYaml .Values.nodeTargets | indent 8 }}
    - job_name: prometheus
      static_configs:
      - targets: ["localhost:9090"]
